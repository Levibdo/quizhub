name: quizhub-local

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quizhub_local}
      POSTGRES_USER: ${POSTGRES_USER:-quizhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copie .env.example para .env e defina POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - quizhub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["migrate"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-quizhub}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-quizhub_local}
      QUIZHUB_SCHEMA_REVISION: "0023"
      QUIZHUB_MIGRATION_MODE: local
      QUIZHUB_LOCAL_ENVIRONMENT: development
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-quizhub}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-quizhub_local}
      JWT_SECRET: ${JWT_SECRET:?copie .env.example para .env e defina JWT_SECRET}
      JWT_COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}
      CSRF_TRUSTED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}
      QUIZHUB_SCHEMA_REVISION: "0023"
      QUIZHUB_LOCAL_ENVIRONMENT: development
      QUIZHUB_BOOTSTRAP_OFFICIAL_CATALOGS: "true"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8001}:8001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:${BACKEND_PORT:-8001}
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-8001}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  quizhub_postgres_data:
